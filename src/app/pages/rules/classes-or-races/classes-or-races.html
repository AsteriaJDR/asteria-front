<div class="main">
    @if (classesOrRaces && classesOrRaces.length > 0) {
        <div class="image-and-icons">
            <img [src]="'assets/' + classesOrRaces[selectedClassIndex].imageUrl" [alt]="classesOrRaces[selectedClassIndex].name" class="class-or-race-image">
            <div class="icons">
                @for(class of classesOrRaces; track class.id; let i = $index) {
                    <div class="hexagon-border" (click)="selectedClassIndex = i">
                        <div class="hexagon-inner">
                            <div class="hexagon" 
                                [style.background-image]="'url(assets/' + class.imageUrl + ')'">
                            </div>
                        </div>
                    </div>
                }
            </div>
        </div>
        <div class="description">
            <h1 class="class-or-race-name">{{ classesOrRaces[selectedClassIndex].name }}</h1>
            <p>{{ classesOrRaces[selectedClassIndex].description }}</p>
        </div>
    }
</div>
