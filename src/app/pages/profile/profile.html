<div class="profile-page">
  <div class="profile-card">

    <div class="profile-header">
      <div class="avatar">
        <lucide-icon [img]="User" [size]="40" [strokeWidth]="1.5"></lucide-icon>
      </div>
      <h1 class="username">{{ user?.username }}</h1>
      <span class="role-badge">
        <lucide-icon [img]="Shield" [size]="11" [strokeWidth]="2"></lucide-icon>
        Joueur
      </span>
    </div>

    <div class="divider"></div>

    <div class="info-section">
      <p class="section-label">Informations du compte</p>

      <div class="info-row">
        <div class="info-icon">
          <lucide-icon [img]="User" [size]="15" [strokeWidth]="1.75"></lucide-icon>
        </div>
        <div class="info-content">
          <span class="info-label">Pseudo</span>
          <span class="info-value">{{ user?.username }}</span>
        </div>
      </div>

      <div class="info-row">
        <div class="info-icon">
          <lucide-icon [img]="Mail" [size]="15" [strokeWidth]="1.75"></lucide-icon>
        </div>
        <div class="info-content">
          <span class="info-label">Adresse email</span>
          <span class="info-value">{{ user?.email }}</span>
        </div>
      </div>
    </div>

  </div>
</div>
